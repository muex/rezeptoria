name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor composer.json declares, and the version development runs on.
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd builds the image fixtures, pdo_sqlite carries the test database.
          extensions: intl, gd, pdo_sqlite, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      # assets/vendor is not committed, and templates fail to render without it.
      # composer's auto-scripts run importmap:install, which fetches it.
      - name: Cache importmap assets
        uses: actions/cache@v4
        with:
          path: assets/vendor
          key: importmap-${{ hashFiles('importmap.php') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # var/tailwind is not committed either, and base.html.twig refuses to
      # render without the built stylesheet — which takes every functional
      # test with it.
      - name: Build the stylesheet
        run: php bin/console tailwind:build

      - name: Lint templates
        run: php bin/console lint:twig templates

      - name: Lint container
        run: php bin/console lint:container

      - name: Static analysis
        run: composer phpstan

      # No database service: the suite runs on SQLite, see .env.test.
      - name: Tests
        run: composer test

  deploy:
    name: Deploy
    # Nothing reaches production that the suite has not passed first.
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Two deploys at once would fight over the release symlink.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, curl, zip, redis

      - name: Install Deployer
        run: composer global require deployer/deployer

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOYER_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOYER_HOST }} >> ~/.ssh/known_hosts

      # deploy.php migrates the database before switching the symlink.
      - name: Run Deployer
        env:
          DEPLOYER_HOST: ${{ secrets.DEPLOYER_HOST }}
          DEPLOYER_USER: ${{ secrets.DEPLOYER_USER }}
        run: ~/.composer/vendor/bin/dep deploy -vvv
