# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout

when@test:
    framework:
        form:
            # The stateless token is completed by JavaScript in the browser,
            # which BrowserKit does not run. Tests drive the forms directly.
            csrf_protection: false
